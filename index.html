<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Sistema de gestión para tienda local">
  <meta name="theme-color" content="#ff0040">

  <!-- PWA Meta Tags -->
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sistema Tienda">

  <title>Iniciar Sesión - Sistema Tienda</title>
  <link rel="icon" href="/icon-192.png" type="image/png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css?v=2.4">

  <style>
    body {
      padding: 0 !important;
    }

    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-lg);
      background: linear-gradient(135deg, #000000 0%, #1a0505 100%);
    }

    .login-card {
      width: 100%;
      max-width: 450px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius-lg);
      padding: var(--spacing-2xl);
      box-shadow: var(--shadow-xl);
    }

    .login-header {
      text-align: center;
      margin-bottom: var(--spacing-2xl);
    }

    .login-logo {
      font-size: 3rem;
      margin-bottom: var(--spacing-md);
    }

    .login-title {
      font-size: 2rem;
      margin-bottom: var(--spacing-sm);
      background: linear-gradient(135deg, var(--primary-light), var(--primary-color));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .login-subtitle {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .login-form {
      margin-bottom: var(--spacing-lg);
    }

    .login-footer {
      text-align: center;
      padding-top: var(--spacing-lg);
      border-top: 1px solid var(--border-color);
    }

    .login-footer p {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-bottom: var(--spacing-sm);
    }

    .toggle-auth {
      color: var(--primary-light);
      cursor: pointer;
      text-decoration: underline;
      font-weight: 600;
    }

    .toggle-auth:hover {
      color: var(--primary-color);
    }
  </style>
</head>

<body>
  <div class="login-container">
    <div class="login-card fade-in">
      <div class="login-header">
        <div class="login-logo"><img src="images/brand-icon.png" alt="Icono" class="custom-brand-icon" style="width: 5rem; height: 5rem; object-fit: contain;" data-anim="bounce"></div>
        <h1 class="login-title">Sistema Tienda</h1>
        <p class="login-subtitle">Gestiona tu negocio desde cualquier lugar</p>
      </div>

      <!-- Formulario de Login -->
      <form id="login-form" class="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Correo Electrónico</label>
          <input type="email" id="email" class="form-input" placeholder="tu@email.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required
            autocomplete="current-password" minlength="6">
          <p class="form-helper" id="password-helper">Mínimo 6 caracteres</p>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">
          <span id="submit-text">Iniciar Sesión</span>
          <span id="submit-loading" class="hidden">Procesando...</span>
        </button>
      </form>

      <div class="login-footer">
        <p id="auth-toggle-text">
          ¿No tienes cuenta?
          <span class="toggle-auth" id="toggle-mode">Registrarse</span>
        </p>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <!-- App Scripts -->
  <script type="module">
    import { initializeFirebase } from './js/services/firebase.js';
    import { login, register } from './js/services/auth.js';
    import { showAlert } from './js/utils/helpers.js';

    // Estado de la página
    let isLoginMode = true;

    // Inicializar Firebase
    try {
      initializeFirebase();
    } catch (error) {
      showAlert('Error al conectar con el servidor. Verifica tu configuración de Firebase.', 'error');
      console.error(error);
    }

    // Elementos del DOM
    const form = document.getElementById('login-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const submitText = document.getElementById('submit-text');
    const submitLoading = document.getElementById('submit-loading');
    const toggleMode = document.getElementById('toggle-mode');
    const authToggleText = document.getElementById('auth-toggle-text');
    const passwordHelper = document.getElementById('password-helper');
    const loginTitle = document.querySelector('.login-title');

    // Verificar si ya hay sesión activa
    firebase.auth().onAuthStateChanged((user) => {
      if (user) {
        // Redirigir al inicio
        window.location.href = 'ventas.html';
      }
    });

    // Manejar submit del formulario
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      // Deshabilitar botón
      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitText.classList.add('hidden');
      submitLoading.classList.remove('hidden');

      try {
        if (isLoginMode) {
          await login(email, password);
          showAlert('¡Bienvenido! Redirigiendo...', 'success');
          // La redirección se hace en onAuthStateChanged
        } else {
          await register(email, password);
          showAlert('¡Cuenta creada! Redirigiendo...', 'success');
          // La redirección se hace en onAuthStateChanged
        }
      } catch (error) {
        showAlert(error.message, 'error');
        submitBtn.disabled = false;
        submitText.classList.remove('hidden');
        submitLoading.classList.add('hidden');
      }
    });

    // Toggle entre login y registro
    toggleMode.addEventListener('click', () => {
      isLoginMode = !isLoginMode;

      if (isLoginMode) {
        loginTitle.textContent = 'Sistema Tienda';
        submitText.textContent = 'Iniciar Sesión';
        authToggleText.innerHTML = '¿No tienes cuenta? <span class="toggle-auth" id="new-toggle">Registrarse</span>';
        passwordHelper.textContent = 'Mínimo 6 caracteres';
      } else {
        loginTitle.textContent = 'Crear Cuenta';
        submitText.textContent = 'Registrarse';
        authToggleText.innerHTML = '¿Ya tienes cuenta? <span class="toggle-auth" id="new-toggle">Iniciar Sesión</span>';
        passwordHelper.textContent = 'Crea una contraseña segura (mínimo 6 caracteres)';
      }

      // Actualizar el event listener del nuevo toggle
      document.getElementById('new-toggle').addEventListener('click', () => {
        toggleMode.click();
      });

      // Limpiar campos
      form.reset();
    });
  </script>

  <!-- Animation & Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
  <script src="/js/animations.js"></script>

  <!-- Mobile Menu Script -->
  <script src="/js/mobile-menu.js?v=2.3"></script>
  <!-- PWA Script -->
  <script src="/js/pwa.js"></script>
</body>

</html>
